name: Deploy to Supabase

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Show Supabase CLI version
        run: |
          supabase --version

      - name: Link Supabase project
        run: |
          # The CLI will use SUPABASE_ACCESS_TOKEN from env for authentication
          supabase link --project-ref $SUPABASE_PROJECT_REF

      - name: Deploy Database Migrations
        run: |
          # If your migrations are in a subdirectory, uncomment and adjust the next line:
          # cd path/to/your/supabase && supabase db push
          supabase db push
